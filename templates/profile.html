
{% extends "base.html" %}

{% block title %}
My Profile
{% endblock %}


{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card shadow-sm">

            <div class="card-body">

                <h1 class="card-title mb-4">
                    My Profile
                </h1>


                <div class="mb-3">

                    <strong>Username:</strong>

                    {{ user.username }}

                </div>


                <div class="mb-3">

                    <strong>Email:</strong>

                    {{ user.email }}

                </div>


                <div class="mb-3">

                    <strong>Role:</strong>

                    {% if user.is_admin %}
                        Administrator
                    {% else %}
                        User
                    {% endif %}

                </div>


                <a
                    href="{{ url_for('posts') }}"
                    class="btn btn-primary"
                >
                    View Posts
                </a>


                <a
                    href="{{ url_for('logout') }}"
                    class="btn btn-secondary"
                >
                    Logout
                </a>

            </div>

        </div>

    </div>

</div>

{% endblock %}
